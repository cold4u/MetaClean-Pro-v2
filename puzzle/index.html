<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Circuit: Mainframe Breach | Studio Logic Puzzle</title>
  <meta name="description" content="Professional cyberpunk logic puzzle game. Route glowing neon circuit wires across 30 progressive mainframe sectors. Built for mobile touch & desktop.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>">
  <link rel="stylesheet" href="style.css?v=3.5">
</head>
<body>

  <div class="puzzle-container">
    
    <!-- TOP HUD / SECTOR BAR -->
    <header class="hud-header">
      <div class="hud-top-row">
        <button id="btnPrevLevel" class="hud-nav-btn" title="Previous Sector (Left Arrow)" aria-label="Previous Sector">◀</button>
        <div class="level-badge">
          <div class="level-badge-title" id="levelTitle">
            <span class="level-tag">SECTOR</span>
            <span class="level-id" id="levelNumber">1</span>
            <span class="level-sep">:</span>
            <span class="level-name" id="levelName">SIGNAL HANDSHAKE</span>
          </div>
          <span class="level-tier-tag" id="levelTier">Tier 1: Junior Hacker • 4×4 Grid</span>
        </div>
        <button id="btnNextLevelNav" class="hud-nav-btn" title="Next Sector (Right Arrow)" aria-label="Next Sector">▶</button>
      </div>

      <div class="hud-stats-row">
        <div class="stat-item">
          <span class="stat-lbl">Moves</span>
          <span class="stat-val"><b id="moveCounter">0</b><span class="stat-sub"> / <span id="parCounter">3</span> Par</span></span>
        </div>
        <div class="fill-bar-wrap">
          <span class="stat-lbl">Sync</span>
          <div class="fill-bar-outer">
            <div class="fill-bar-inner" id="fillBar"></div>
          </div>
          <span class="stat-val" id="fillPercent">0%</span>
        </div>
        <div class="hud-stars" id="levelStarsHeader" title="Sector Stars">☆☆☆</div>
      </div>
    </header>

    <!-- CIRCUIT BOARD & CANVAS LAYER -->
    <main class="board-wrapper" id="boardWrapper">
      <div class="circuit-board" id="circuitBoard"></div>
      <canvas class="circuit-canvas" id="circuitCanvas"></canvas>
      <canvas class="fx-canvas" id="fxCanvas"></canvas>
    </main>

    <!-- BOTTOM CONTROLS BAR -->
    <footer class="controls-bar" id="controlsBar">
      <button id="btnLevelSelect" class="ctrl-btn prime" aria-label="Sector Directory">🗂️ Sectors</button>
      <button id="btnUndo" class="ctrl-btn" aria-label="Undo Wire (Z)">↩ Undo</button>
      <button id="btnReset" class="ctrl-btn" aria-label="Reset Sector (R)">↺ Reset</button>
      <button id="btnHint" class="ctrl-btn" aria-label="Get Hint (H)">💡 Hint</button>
      <button id="btnSound" class="ctrl-btn" aria-label="Toggle Sound">🔊 SFX: ON</button>
    </footer>

  </div>

  <!-- VICTORY OVERLAY DIALOG -->
  <div id="winModal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-dialog win-dialog">
      <div class="win-header-deco">✦ SYSTEM OVERRIDE SUCCESSFUL ✦</div>
      <div class="modal-title" id="winTitle">MAINFRAME BREACHED!</div>
      <div class="modal-stars" id="winStarsDisplay">★★★</div>
      <div class="modal-stats" id="winStats"></div>
      <div class="modal-actions">
        <button id="btnReplayLevel" class="modal-btn secondary">↺ Replay</button>
        <button id="btnNextLevel" class="modal-btn primary">Next Sector ➔</button>
      </div>
    </div>
  </div>

  <!-- SECTOR DIRECTORY (LEVEL SELECT) MODAL -->
  <div id="levelModal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-dialog level-select-dialog">
      <div class="modal-title">MAINFRAME SECTORS</div>
      <div class="level-select-sub">
        <span>Stars Collected: <b id="totalStarsCount" style="color: var(--gold);">0</b> / 90 ★</span>
      </div>
      
      <!-- Tier Filter Tabs -->
      <div class="tier-tabs">
        <button class="tier-tab active" data-tier="all">All</button>
        <button class="tier-tab" data-tier="1">Tier 1 (4×4)</button>
        <button class="tier-tab" data-tier="2">Tier 2 (5×5)</button>
        <button class="tier-tab" data-tier="3">Tier 3 (6×6)</button>
        <button class="tier-tab" data-tier="4">Tier 4 (7-8×8)</button>
      </div>

      <div class="level-grid" id="levelGrid"></div>

      <div class="modal-actions level-modal-actions">
        <button id="btnEndlessMode" class="modal-btn secondary" style="flex: 1.2;">♾️ Endless Sector</button>
        <button id="btnCloseLevels" class="modal-btn primary" style="flex: 1;">Close</button>
      </div>
    </div>
  </div>

  <!-- Game Scripts -->
  <script src="js/levels.js?v=3.5"></script>
  <script src="js/audio.js?v=3.5"></script>
  <script src="js/puzzle.js?v=3.5"></script>
</body>
</html>
